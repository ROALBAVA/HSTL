<title>HSTL Ventas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style id="hstl-css">
/* Layout: sticky header + tab bar, single content column (max 1180px), cards only for KPI tiles, charts and panels */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde2ea;
  --ink:#16202e; --ink-2:#4a5568; --ink-3:#7a8597;
  --accent:#2747a8; --accent-ink:#ffffff; --accent-soft:#e3e9fa;
  --cost:#b9c6e4; --debt:#c0392b; --debt-soft:#fbe9e7; --good:#1e7a4f; --good-soft:#e3f4ea;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 4px 14px rgba(22,32,46,.05);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171e29; --surface-2:#1e2733; --line:#2a3442;
  --ink:#e8edf5; --ink-2:#aab4c4; --ink-3:#7c8799;
  --accent:#7d9bff; --accent-ink:#0f141c; --accent-soft:#232f4d;
  --cost:#3b4a69; --debt:#ff7a6b; --debt-soft:#3a1f1d; --good:#5fd39a; --good-soft:#18342a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --surface-2:#1e2733; --line:#2a3442;
  --ink:#e8edf5; --ink-2:#aab4c4; --ink-3:#7c8799;
  --accent:#7d9bff; --accent-ink:#0f141c; --accent-soft:#232f4d;
  --cost:#3b4a69; --debt:#ff7a6b; --debt-soft:#3a1f1d; --good:#5fd39a; --good-soft:#18342a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0}
.spacer{flex:1}
.status{font-size:12px;color:var(--ink-3);white-space:nowrap}
.status.warn{color:var(--debt)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--debt);border-color:var(--debt)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.link:focus-visible,tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.muted{color:var(--ink-3)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .val{white-space:nowrap;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.kpi .sub{font-size:13px;color:var(--ink-3)}
.kpi.debt{background:var(--debt-soft);border-color:transparent}
.kpi.debt .val{color:var(--debt)}
.delta.up{color:var(--good)} .delta.down{color:var(--debt)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:120px}
th.n,td.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.debe{background:var(--debt-soft);color:var(--debt)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.tr{background:var(--accent-soft);color:var(--accent)}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.neg{color:var(--debt)}
.debtv{color:var(--debt);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input[type=text],input[type=number],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5;line-height:1.4}
.list{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--debt);border-radius:3px}
.banner{background:var(--debt-soft);color:var(--debt);padding:10px 14px;border-radius:8px;font-size:14px}
.monthnav{display:flex;align-items:center;gap:6px}
.empty{padding:24px;text-align:center;color:var(--ink-3)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:20px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);margin-top:4vh}
.modal.wide{max-width:860px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{gap:10px}.form label{font-size:12px}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"].d{background:var(--debt);color:#fff}
.seg button[aria-pressed="true"].p{background:var(--good);color:#fff}
.calc{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.err{color:var(--debt);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
@media (max-width:560px){.status{display:none}.brand small{display:none}.kpi .val{font-size:22px}h1{font-size:22px}}
.fab{display:none}
.hide-m{}
@media (max-width:600px){
  input,select,textarea{font-size:16px!important}
  .hide-m{display:none}
  .bar{padding-block:10px;gap:8px}
  .bar .newsale{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
  main{padding-block:14px 100px;gap:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .val{font-size:19px}
  .kpi .sub{font-size:12px}
  .panel{padding:14px}
  td,th{padding:9px 6px}
  .tab{padding:10px 11px}
  .scrim{padding:0;align-items:flex-end}
  .modal,.modal.wide{max-width:none;margin-top:auto;border-radius:16px 16px 0 0;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .actions .btn{flex:1}
  .actions .left{flex:0 0 auto}
  .controls input[type=search]{flex:1 1 160px}
  .btn.sm{padding:7px 10px}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px)}
}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.chip{transition:background .15s,border-color .15s}}

function niceMax(v){if(v<=0)return 100;var p=Math.pow(10,Math.floor(Math.log10(v)));var n=v/p;var s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
function stackChart(items,opts){
  opts=opts||{};var narrow=window.innerWidth<600;var W=narrow?400:720,H=opts.h||(narrow?230:240),L=52,R=8,T=12,B=26;
  var max=niceMax(Math.max.apply(null,items.map(function(i){return i.ventas;}).concat([1])));
  var iw=W-L-R,ih=H-T-B,bw=iw/items.length,barW=Math.max(4,Math.min(36,bw*0.62));
  var y=function(v){return T+ih-(v/max)*ih;};
  var g='';for(var k=0;k<=4;k++){var v=max*k/4,yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+(v>=1000?(v/1000).toLocaleString('es-PE',{maximumFractionDigits:1})+'k':v)+'</text>';}
  var bars='',labs='',hits='';var every=Math.ceil(items.length/(narrow?6:12));
  items.forEach(function(it,i){var cx=L+bw*i+bw/2,x=cx-barW/2;
    var vc=Math.max(0,it.costo),vg=Math.max(0,it.gan);var tot=vc+vg;
    if(tot>0){var yTop=y(tot),yMid=y(vc),r=Math.min(4,barW/2);
      // cost segment (bottom)
      if(vc>0)bars+='<rect x="'+x+'" y="'+yMid+'" width="'+barW+'" height="'+Math.max(0,y(0)-yMid)+'" fill="var(--cost)"/>';
      // gain segment (top) with rounded top, 2px surface gap
      if(vg>0){var gh=Math.max(0,yMid-yTop-(vc>0?2:0));bars+='<path d="M'+x+','+(yTop+gh)+'V'+(yTop+r)+'Q'+x+','+yTop+' '+(x+r)+','+yTop+'H'+(x+barW-r)+'Q'+(x+barW)+','+yTop+' '+(x+barW)+','+(yTop+r)+'V'+(yTop+gh)+'Z" fill="var(--accent)"/>';}
    }
    if(i%every===0||(!narrow&&i===items.length-1&&items.length<=12))labs+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)">'+esc(it.label)+'</text>';
    hits+='<rect class="hit" data-i="'+i+'" x="'+(L+bw*i)+'" y="'+T+'" width="'+bw+'" height="'+ih+'" fill="transparent"'+(it.go?' style="cursor:pointer"':'')+'/>';
  });
  var id='c'+Math.random().toString(36).slice(2,8);
  CHARTS[id]=items;
  return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'Ventas por mes')+'">'+g+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--ink-3)" stroke-width="1"/>'+bars+labs+hits+'</svg><div class="tip" hidden></div></div>'+
   '<div class="legend"><span><i style="background:var(--accent)"></i>Ganancia</span><span><i style="background:var(--cost)"></i>Costo</span><span class="muted">Altura total = ventas</span></div>';
}

function compShare(s){var l=lotAt(s.f||s.p+'-01');return l?r2(s.q*(s.u-l.x)):null;}

  var chip=function(v,l,n){return '<button class="chip" data-uflt="'+v+'" aria-pressed="'+(flt===v)+'">'+l+' <span class="muted">'+n+'</span></button>';};
  return '<div class="head"><h1>Mi utilidad</h1><span class="spacer"></span><button class="btn sm" data-bulk>Marcar antiguas…</button></div>'+
  '<p class="muted" style="margin:0;max-width:70ch">Utilidad = precio de venta − cantidad × lo que te cobras (Y). Va a tu cuenta personal. La diferencia entre lo que te cobras y lo que te cuesta (Y − X) queda para la empresa.</p>'+
  '<div class="kpis">'+kpi('Por transferir',money(sum(ready,gain)),ready.length+' ventas pagadas')+
   kpi('Esperando cobro',money(sum(held,gain)),held.length+' ventas con deuda')+
   kpi('Transferido '+MES[+cp.slice(5)-1].toLowerCase(),money(sum(trM,gain)),trM.length+' ventas')+
   kpi('Para la empresa',money(compT),(withLot.length?'Y − X · '+MES[+cp.slice(5)-1].toLowerCase()+': '+money(compM):'Registra tu stock con X para calcularlo'))+'</div>'+
  bulk+
  '<section class="panel"><div class="head"><h2>Utilidades sin transferir</h2></div>'+
   '<div class="controls"><div class="chips" role="group" aria-label="Filtrar">'+chip('todas','Todas',pendAll.length)+chip('pagadas','Pagadas',ready.length)+chip('deuda','Con deuda',held.length)+'</div><input type="search" id="uq" placeholder="Buscar cliente" value="'+esc(ui.uq||'')+'" aria-label="Buscar cliente"><span class="spacer"></span><label class="muted" style="font-size:13px">Ordenar <select id="usort">'+[['fecha','Fecha'],['cliente','Cliente (A-Z)'],['utilidad','Utilidad'],['estado','Estado']].map(function(o){return '<option value="'+o[0]+'"'+(srt===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label></div>'+

function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function MOV(){if(!Array.isArray(DB.mov))DB.mov=[];return DB.mov;}
function DEBTS(){if(!Array.isArray(DB.debts))DB.debts=[];return DB.debts;}
function recPay(s,amt){amt=r2(amt);if(!(amt>0))return;(s.pl||(s.pl=[])).push([today(),amt]);}
function cajaInfo(){
  var c=DB.caja;if(!c)return null;var D=c.f,ev=[];
  function add(f,m,l,k,ref){m=r2(m);if(Math.abs(m)<0.005)return;ev.push({f:f,m:m,l:l,k:k,ref:ref||''});}
  add(D,c.m,'Saldo inicial de caja','ini');
  S.forEach(function(s){var sd=s.f||s.p+'-01';
    if(sd>=D){add(sd,s.v-bal(s),(s.d?'Abono / cobro':'Venta cobrada')+' · '+s.c,'venta');}
    else if(s.pl)s.pl.forEach(function(x){if(x[0]>=D)add(x[0],x[1],'Cobro de deuda · '+s.c,'cobro');});});
  var tg={};S.forEach(function(s){if(s.t&&s.t>=D){tg[s.t]=(tg[s.t]||0)+gain(s);}});
  Object.keys(tg).forEach(function(f){add(f,-tg[f],'Transferencia de utilidad a tu cuenta','trans');});
  LOTS().forEach(function(l){if(l.q>0&&!l.np){var pd=l.pf||l.f;if(pd>=D)add(pd,-(l.q*l.x),'Pago de stock · '+num(l.q)+' uds'+(l.n?' · '+l.n:''),'stock');}});
  DEBTS().forEach(function(d){if(d.cin&&d.f>=D)add(d.f,d.m,'Préstamo recibido · '+d.w,'deuda+');if(d.pd&&d.pd>=D)add(d.pd,-d.m,'Pago de deuda · '+d.w,'deuda-');});
  MOV().forEach(function(m){add(m.f,m.k==='in'?m.m:-m.m,(m.n||(m.k==='in'?'Ingreso':'Gasto')),m.k==='in'?'in':'out',m.id);});
  ev.sort(function(a,b){return a.f<b.f?1:a.f>b.f?-1:(a.k==='ini'?1:b.k==='ini'?-1:0);});
  var total=sum(ev,function(e){return e.m;});
  var lotsDebt=LOTS().filter(function(l){return l.q>0&&l.np;}),manDebt=DEBTS().filter(function(d){return !d.pd;});
  var debe=r2(sum(lotsDebt,function(l){return l.q*l.x;})+sum(manDebt,function(d){return d.m;}));
  var utilP=sum(utilPending().filter(function(s){return !bal(s);}),gain);
  return{D:D,ev:ev,total:total,utilP:utilP,libre:r2(total-utilP),debe:debe,lotsDebt:lotsDebt,manDebt:manDebt,meDeben:sum(S,bal)};
}

function submitSale(){
  readDraft();var d=ui.modal.draft,err=document.getElementById('ferr');
  var c=String(d.c||'').trim().replace(/\s+/g,' '),q=+d.q,v=+d.v,u=+d.u,a=+d.a||0;
  var msg=!c?'Escribe el nombre del cliente.':!(q>0)?'La cantidad debe ser mayor que 0.':!(v>=0)||d.v===''?'Escribe el precio de venta.':!(u>=0)||d.u===''?'Escribe el costo unitario.':!d.f?'Elige la fecha.':'';
  if(msg){err.textContent=msg;err.hidden=false;return;}
  var ex=clients().find(function(x){return x.k===key(c);});if(ex)c=ex.name;
  var rec={f:d.f,p:d.f.slice(0,7),c:c,q:r2(q),v:r2(v),u:r2(u),d:d.d?1:0};
  if(d.t)rec.t=d.t;
  if(d.d&&a>0)rec.a=r2(a);if(String(d.n||'').trim())rec.n=String(d.n).trim();
  if(rec.d&&rec.a>=rec.v){rec.d=0;delete rec.a;}
  if(ui.modal.id){var i=S.findIndex(function(x){return x.id===ui.modal.id;});rec.id=S[i].id;if(S[i].pl)rec.pl=S[i].pl;var ob=bal(S[i]),nb=bal(rec);if(nb<ob)recPay(rec,ob-nb);S[i]=rec;ui.modal=ui.modal.back||null;render();changed('Venta actualizada');}
  else{DB.seq=(DB.seq||S.length)+1;rec.id='s'+DB.seq;S.push(rec);ui.modal=ui.modal.back||null;render();changed('Venta agregada');}
}
function applyPayment(k,amt){
  var pend=S.filter(function(s){return key(s.c)===k&&bal(s)>0;}).sort(function(a,b){return (a.f||a.p)<(b.f||b.p)?-1:1;});
  var left=r2(amt);pend.forEach(function(s){if(left<=0)return;var b=bal(s);if(left>=b){left=r2(left-b);recPay(s,b);s.d=0;delete s.a;}else{recPay(s,left);s.a=r2((s.a||0)+left);left=0;}});
  return left;
}
function csv(){
  var lines=[['Fecha','Mes','Cliente','Cantidad','Precio venta','Costo unitario','Costo','Ganancia','Estado','Abonado','Saldo','Nota'].join(',')];
  sortSales(S).reverse().forEach(function(s){lines.push([s.f,s.p,s.c,s.q,s.v,s.u,cost(s),gain(s),s.d?'Debe':'Pagado',s.a||0,bal(s),s.n||''].map(function(x){x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(','));});
  downloadFile('HSTL-ventas-'+today()+'.csv','﻿'+lines.join('\n'),'text/csv;charset=utf-8');
}

function readBackupFile(file){
  var r=new FileReader();r.onload=function(){var txt=String(r.result||''),obj=null;
    try{if(/^\s*</.test(txt)){var m=txt.match(/<script type="application\/json" id="hstl-data">([\s\S]*?)<\/script>/);if(m)obj=JSON.parse(m[1]);}else obj=JSON.parse(txt);}catch(e){obj=null;}
    if(!obj||!Array.isArray(obj.sales)||(obj.sales.length&&!obj.sales[0].c)){var er=document.getElementById('bk-err');if(er){er.textContent='Ese archivo no es un respaldo de HSTL. Elige el .json o el .html que descargaste desde la app.';er.hidden=false;}return;}
    ui.modal.imp=obj;render();};
  r.readAsText(file);
}
